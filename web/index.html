<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyFram - 农场游戏</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top-bar">
    <span class="game-title">🌾 MyFram</span>
    <span id="clock">第 1 天 · 春</span>
    <span id="gold">💰 100</span>
  </header>

  <div id="main-area">
    <div id="toolbar">
      <button class="tool-btn active" data-tool="hand" title="查看 (Q)">👆<br><small>查看</small></button>
      <button class="tool-btn" data-tool="hoe" title="锄头 (W)">⛏️<br><small>锄头</small></button>
      <button class="tool-btn" data-tool="water" title="浇水 (E)">💧<br><small>浇水</small></button>
      <button class="tool-btn" data-tool="seed" title="播种 (R)">🌱<br><small>播种</small></button>
      <button class="tool-btn" data-tool="harvest" title="收获 (T)">🧺<br><small>收获</small></button>
      <button class="tool-btn" data-tool="axe" title="斧头 (Y)">🪓<br><small>斧头</small></button>
    </div>

    <div id="game-container">
      <canvas id="game-canvas"></canvas>
      <div id="tooltip" class="hidden"></div>
    </div>

    <div id="side-panel">
      <div id="info-panel">
        <h3>📍 格子信息</h3>
        <div id="cell-info">点击地图上的格子查看信息</div>
      </div>

      <div id="seed-select" class="hidden">
        <h3>🌱 选择种子</h3>
        <div id="seed-list"></div>
      </div>

      <div id="inventory-panel">
        <h3>🎒 背包 <small>(I 键开关)</small></h3>
        <div id="inventory-grid"></div>
      </div>

      <div id="log-panel">
        <h3>📜 日志</h3>
        <div id="game-log"></div>
      </div>
    </div>
  </div>

  <footer id="bottom-bar">
    <span>WASD/方向键移动视角 · Q/W/E/R/T/Y 切换工具 · 鼠标点击操作 · I 背包 · Space 下一天</span>
  </footer>
</div>

<script src="js/constants.js"></script>
<script src="js/terrain.js"></script>
<script src="js/map_data.js"></script>
<script src="js/crops.js"></script>
<script src="js/inventory.js"></script>
<script src="js/renderer.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
